[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doge_exam"
version = "0.1.0"
description = "Neural Networks exam project: data-free model merging with DOGE on CLIP ViT-B/32"
requires-python = ">=3.10,<3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: requires network access or large downloads",
]
